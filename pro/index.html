<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional view | srix</title>
    <meta name="description" content="Professional portfolio of Nizampuram Srivardhan (srix): Flutter, Firebase, Python and cybersecurity projects." />
    <meta name="theme-color" content="#0b0f1a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nizampuram Srivardhan (srix) | Professional view" />
    <meta property="og:description" content="Projects, skills and journey of a B.Tech CSE student who builds apps that help real people." />
    <meta name="twitter:card" content="summary" />
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        var theme = null;
        try {
          theme = localStorage.getItem('srix-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        root.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body class="pro" id="top">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="nav-inner">
        <a class="brand" id="brand" href="#top">srix</a>
        <nav aria-label="Main">
          <ul class="nav-links">
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#journey">Journey</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </nav>
        <button class="theme-toggle" id="theme-toggle" type="button">Light theme</button>
      </div>
    </header>

    <main id="main">
      <section class="section hero reveal" aria-labelledby="hero-name">
        <p class="pixel kicker" id="hero-handle"></p>
        <h1 class="pixel" id="hero-name"></h1>
        <p class="tagline" id="hero-tagline"></p>
        <div class="actions">
          <a class="btn" href="#projects">View projects</a>
          <a class="btn" href="#contact">Contact me</a>
          <a class="btn" href="../world/">Try the 3D version</a>
        </div>
        <button class="hero-phone" id="hero-phone" type="button" aria-label="Open the Anchor live demo in a phone">
          <span class="hero-phone-body" aria-hidden="true">
            <span class="hero-phone-screen pixel">A</span>
          </span>
          <span class="hero-phone-text">
            <span class="hero-phone-title pixel">ANCHOR</span>
            <span>Try the live demo</span>
          </span>
        </button>
      </section>

      <section class="section reveal" id="about" aria-labelledby="about-title">
        <h2 class="pixel section-title" id="about-title">About</h2>
        <p class="about-text" id="about-text"></p>
      </section>

      <section class="section reveal" id="skills" aria-labelledby="skills-title">
        <h2 class="pixel section-title" id="skills-title">Skills</h2>
        <div class="skill-groups" id="skill-groups"></div>
      </section>

      <section class="section reveal" id="projects" aria-labelledby="projects-title">
        <h2 class="pixel section-title" id="projects-title">Projects</h2>
        <div class="project-list" id="project-list"></div>
      </section>

      <section class="section reveal" id="journey" aria-labelledby="journey-title">
        <h2 class="pixel section-title" id="journey-title">Journey</h2>
        <ol class="timeline" id="timeline-list"></ol>
      </section>

      <section class="section reveal" id="contact" aria-labelledby="contact-title">
        <h2 class="pixel section-title" id="contact-title">Contact</h2>
        <div class="contact-links" id="contact-links"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p id="footer-text"></p>
    </footer>

    <script type="module" src="/src/pro/main.js"></script>
  </body>
</html>
